<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444">
<style>
  .t { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3; }
  .s { font: 400 11.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8b949e; }
  .lbl { font: 600 11px 'Fira Code', Consolas, monospace; fill: #dc2626; letter-spacing: 1px; }
  .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-opacity: .35; } }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="443" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="5" height="443" rx="2" fill="#dc2626"/>
<text x="30" y="42" style="font: 800 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3">Multi-Agent Choreography: Amazon EventBridge</text>
<text x="30" y="66" style="font: 400 13px 'Fira Code', Consolas, monospace; fill: #dc2626">// decentralized: agents never call each other, they react to events</text>
<text x="30" y="131.0" class="lbl">TRIGGER</text>
<rect x="150.0" y="96" width="820.0" height="62" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
